<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F3652" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <!-- Google Site Verification (GSC Code) -->
  <meta name="google-site-verification" content="rJlkOVXPnQNj8F3FD3_kwLVrqO0NydyxlvvWEtOReSo" />

  <!-- Structured data is emitted per route at runtime by <Meta /> /
       blog-details (single @graph with stable @ids) and baked into the
       initial HTML of every prerendered route by scripts/post-build-seo.js.
       No static JSON-LD lives here so indexed pages never carry duplicate
       Organization / WebSite / BreadcrumbList blocks. -->

  <!-- Optimized Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://aia.in.net" />

  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
  <link rel="dns-prefetch" href="https://www.google-analytics.com" />
  <!-- Initialize the tag queue immediately (no network) so conversion and
       page-view events can be queued before the tag scripts finish loading. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag =
      window.gtag ||
      function () {
        window.dataLayer.push(arguments);
      };
  </script>

  <!-- Early Third-Party Loading:
       Tags start after DOM parsing on the first idle slot instead of waiting
       for window.load plus a fixed 10-14s timeout. They are fully independent
       of any popup/UI lifecycle, while idle scheduling keeps them off the
       critical rendering path. -->
  <script>
    (function () {
      var schedule = function (fn, delay, timeout) {
        var run = function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(fn, { timeout: timeout });
          } else {
            window.setTimeout(fn, 0);
          }
        };

        var start = function () {
          window.setTimeout(run, delay);
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start, { once: true });
        } else {
          start();
        }
      };

      // Google Ads / gtag conversion loader. Exposed globally so the React
      // analytics component reuses the same in-flight request instead of
      // starting a second one after hydration.
      var loadGtag = function () {
        if (window.__AIA_GTAG_PROMISE__) return window.__AIA_GTAG_PROMISE__;
        if (window.__GA_LOADED__) return Promise.resolve();

        window.__AIA_GTAG_PROMISE__ = fetch(
          "https://aia.in.net/webapi/public/api/getGTag",
          { headers: { Accept: "application/json" } }
        )
          .then(function (response) {
            if (!response.ok) {
              throw new Error("GTag request failed");
            }
            return response.json();
          })
          .then(function (payload) {
            var gtagHtml = payload && payload.data && payload.data.gtag;
            if (!gtagHtml) return;

            var container = document.createElement("div");
            container.innerHTML = gtagHtml;

            var scripts = container.querySelectorAll("script");
            for (var i = 0; i < scripts.length; i++) {
              var oldScript = scripts[i];
              var newScript = document.createElement("script");

              if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.async = true;
              } else {
                newScript.text = oldScript.textContent;
              }

              document.head.appendChild(newScript);
            }

            window.__GA_LOADED__ = true;
          })
          .catch(function () {
            window.__AIA_GTAG_PROMISE__ = null;
          });

        return window.__AIA_GTAG_PROMISE__;
      };

      window.__AIA_LOAD_GTAG__ = loadGtag;
      schedule(loadGtag, 0, 500);

      // Google Tag Manager
      schedule(function () {
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({
            "gtm.start": new Date().getTime(),
            event: "gtm.js",
          });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, "script", "dataLayer", "GTM-KJ7WJLKJ");
      }, 0, 500);

      // Microsoft Clarity
      schedule(function () {
        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "z4o0i0ydf7");
      }, 1500, 1500);

      // Google Ad Code
      schedule(function () {
        var script = document.createElement("script");
        script.async = true;
        script.src =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX";
        script.crossOrigin = "anonymous";
        document.head.appendChild(script);
      }, 4000, 2000);
    })();
  </script>

  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </noscript>
</head>
