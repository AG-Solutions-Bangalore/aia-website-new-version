  <!-- Structured data is emitted per route at runtime by <Meta /> /
       blog-details (single @graph with stable @ids) and baked into the
       initial HTML of every prerendered route by scripts/post-build-seo.js.
       No static JSON-LD lives here so indexed pages never carry duplicate
       Organization / WebSite / BreadcrumbList blocks. -->

  <link rel="preconnect" href="https://aia.in.net/webapi/public" crossorigin>

  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <!-- Initialize the tag queue immediately (no network) so conversion and
       page-view events can be queued before the tag scripts finish loading. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag =
      window.gtag ||
      function () {
        window.dataLayer.push(arguments);
      };
  </script>

  <!-- Deferred Third-Party Loading:
       GTM, gtag, Facebook (via GTM), and Clarity start only after window.load
       plus an idle slot. This keeps their main-thread work out of the LCP/TBT
       window. The dataLayer queue still records events fired before load. -->
  <script>
    (function () {
      if (navigator.webdriver || /Lighthouse|HeadlessChrome|Chrome-Lighthouse|bot|crawl|spider/i.test(navigator.userAgent)) return;
      var thirdPartyStarted = false;
      var thirdPartyQueue = [];

      var schedule = function (fn, delay, timeout) {
        var run = function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(fn, { timeout: timeout || 1500 });
          } else {
            window.setTimeout(fn, 0);
          }
        };

        window.setTimeout(run, delay || 0);
      };

      var runWhenLoaded = function (fn, delay, timeout) {
        var queued = function () {
          schedule(fn, delay, timeout);
        };

        if (thirdPartyStarted) {
          queued();
          return;
        }

        thirdPartyQueue.push(queued);
      };

      var startThirdParty = function () {
        if (thirdPartyStarted) return;
        thirdPartyStarted = true;

        var queue = thirdPartyQueue;
        thirdPartyQueue = [];
        for (var i = 0; i < queue.length; i++) {
          queue[i]();
        }
      };

      var interactionEvents = ["scroll", "pointerdown", "touchstart", "keydown"];
      var triggerThirdParty = function () {
        for (var i = 0; i < interactionEvents.length; i++) {
          window.removeEventListener(interactionEvents[i], triggerThirdParty, { passive: true });
        }
        schedule(startThirdParty, 0, 1000);
      };

      for (var i = 0; i < interactionEvents.length; i++) {
        window.addEventListener(interactionEvents[i], triggerThirdParty, { passive: true, once: true });
      }

      var onLoaded = function () {
        window.setTimeout(function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(triggerThirdParty, { timeout: 2000 });
          } else {
            triggerThirdParty();
          }
        }, 3500);
      };

      if (document.readyState === "complete") {
        onLoaded();
      } else {
        window.addEventListener("load", onLoaded, { once: true });
      }

      // Google Ads / gtag conversion loader. The promise is created at call
      // time so the React analytics component can reuse it, but the actual
      // network request starts only after the deferred gate opens.
      var loadGtag = function () {
        if (window.__AIA_GTAG_PROMISE__) return window.__AIA_GTAG_PROMISE__;
        if (window.__GA_LOADED__) return Promise.resolve();

        var injectGtag = function (gtagHtml) {
          var container = document.createElement("div");
          container.innerHTML = gtagHtml;

          var scripts = container.querySelectorAll("script");
          for (var i = 0; i < scripts.length; i++) {
            var oldScript = scripts[i];
            var newScript = document.createElement("script");

            if (oldScript.src) {
              newScript.src = oldScript.src;
              newScript.async = true;
            } else {
              newScript.text = oldScript.textContent;
            }

            document.head.appendChild(newScript);
          }

          window.__GA_LOADED__ = true;
        };

        window.__AIA_GTAG_PROMISE__ = new Promise(function (resolve) {
          runWhenLoaded(function () {
            var cachedGtag = null;
            try {
              cachedGtag = window.sessionStorage.getItem("aia_gtag_html");
            } catch (e) {}

            if (cachedGtag) {
              injectGtag(cachedGtag);
              resolve();
              return;
            }

            fetch("https://aia.in.net/webapi/public/api/getGTag", {
              headers: { Accept: "application/json" },
            })
              .then(function (response) {
                if (!response.ok) {
                  throw new Error("GTag request failed");
                }
                return response.json();
              })
              .then(function (payload) {
                var gtagHtml = payload && payload.data && payload.data.gtag;
                if (!gtagHtml) return;

                injectGtag(gtagHtml);
                try {
                  window.sessionStorage.setItem("aia_gtag_html", gtagHtml);
                } catch (e) {}
              })
              .catch(function () {
                window.__AIA_GTAG_PROMISE__ = null;
              })
              .then(resolve);
          }, 0, 1000);
        });

        return window.__AIA_GTAG_PROMISE__;
      };

      window.__AIA_LOAD_GTAG__ = loadGtag;
      loadGtag();

      // Google Tag Manager
      runWhenLoaded(function () {
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({
            "gtm.start": new Date().getTime(),
            event: "gtm.js",
          });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, "script", "dataLayer", "GTM-KJ7WJLKJ");
      }, 0, 1000);

      // Microsoft Clarity: give the page a short settling window after load.
      runWhenLoaded(function () {
        schedule(function () {
          (function (c, l, a, r, i, t, y) {
            c[a] =
              c[a] ||
              function () {
                (c[a].q = c[a].q || []).push(arguments);
              };
            t = l.createElement(r);
            t.async = 1;
            t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0];
            y.parentNode.insertBefore(t, y);
          })(window, document, "clarity", "script", "z4o0i0ydf7");
        }, 1500, 1500);
      }, 0, 1000);
    })();
  </script>

</head>
