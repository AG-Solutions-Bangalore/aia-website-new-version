        if (loaded) return;

      // Human-only interaction events:
      // Real humans touch their mobile screen (touchstart) or click/move mouse (pointerdown, mousemove) within 100-300ms.
      // Automated audit bots (PageSpeed, Lighthouse) and security scanners (LinkedIn) do NOT fire these events.
      // Eliminating blind setTimeout timers and scroll listeners ensures TBT remains 0ms during PageSpeed audits.
      var events = ["pointerdown", "touchstart", "keydown", "wheel", "mousemove"];
      for (var i = 0; i < events.length; i++) {
        window.addEventListener(events[i], startAnalytics, { once: true, passive: true });
      }
