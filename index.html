<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F3652" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <!-- Google Site Verification (GSC Code) -->
  <meta name="google-site-verification" content="rJlkOVXPnQNj8F3FD3_kwLVrqO0NydyxlvvWEtOReSo" />

  <!-- Structured data is emitted per route at runtime by <Meta /> /
       blog-details (single @graph with stable @ids) and baked into the
       initial HTML of every prerendered route by scripts/post-build-seo.js.
       No static JSON-LD lives here so indexed pages never carry duplicate
       Organization / WebSite / BreadcrumbList blocks. -->

  <!-- Optimized Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://aia.in.net" />

  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
  <link rel="dns-prefetch" href="https://www.google-analytics.com" />
  <!-- Delayed Third-Party Script Loading (Advanced) -->
  <script>
    window.addEventListener("load", function () {
      // GTM Delay
      setTimeout(function () {
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({
            "gtm.start": new Date().getTime(),
            event: "gtm.js",
          });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, "script", "dataLayer", "GTM-KJ7WJLKJ");
      }, 12000);
    });
  </script>

  <!-- Google Ad Code Implement - Async but also delayed slightly -->
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var script = document.createElement("script");
        script.async = true;
        script.src =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX";
        script.crossOrigin = "anonymous";
        document.head.appendChild(script);
      }, 14000);
    });
  </script>
  <!-- End Google Ad Code -->

  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </noscript>
</head>

<body class="antialiased font-poppins">
  <!-- Google Tag Manager (noscript) - Add this inside body tag for all pages -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KJ7WJLKJ" height="0" width="0"
      style="display: none; visibility: hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
